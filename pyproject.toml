[project]
name = "openfury"
version = "0.1.0"
description = "Open-source AI phone screening agent: places hiring calls, screens candidates, returns a verdict, transcript and recording by webhook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "livekit-agents>=1.8.2,<2",
  "livekit-api>=1.2",
  "livekit-plugins-elevenlabs>=1.8.2",
  "livekit-plugins-google>=1.8.2",
  "livekit-plugins-sarvam>=1.8.2",
  "livekit-plugins-smallestai>=1.8.2",
  "livekit-plugins-silero>=1.8.2",
  "livekit-plugins-noise-cancellation>=0.3.2",
  "livekit-plugins-turn-detector>=1.8.2",
  "google-genai>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
openfury-server = "openfury.server:main"
openfury-worker = "openfury.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openfury"]

[tool.setuptools.package-data]
openfury = ["static/*.html"]
